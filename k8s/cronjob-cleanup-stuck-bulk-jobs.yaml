apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-stuck-bulk-jobs
  namespace: default
  labels:
    app: springboot-iam-cron
    job-type: maintenance
spec:
  # Run every 15 minutes (Sweeper/Reaper Pattern)
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: cleanup-stuck-bulk-jobs
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl-trigger
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Triggering stuck bulk jobs sweeper/reaper..."
                  RESPONSE=$(curl -s -S -f -X POST \
                    -H "Content-Type: application/json" \
                    http://springboot-iam-service.default.svc.cluster.local:8080/internal/jobs/cleanup-stuck-bulk-jobs)
                  echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Response: $RESPONSE"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000

