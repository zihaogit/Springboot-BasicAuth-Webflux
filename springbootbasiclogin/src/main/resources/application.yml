spring:
  r2dbc:
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
    url: r2dbc:postgresql://localhost:5432/${POSTGRES_DB:security_assignment}
  flyway:
    username: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:security_assignment}
    locations: classpath:db/migration/common,classpath:db/migration/dev
    baseline-on-migrate: true
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Singapore}
  main:
    banner-mode: off

app:
  timezone: ${APP_TIMEZONE:Asia/Singapore}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  #for email (localhost)
  mail:
    host: log
    port: 1025
    properties:
      mail:
        smtp:
          auth: false

logging:
  level:
    #set root logging to "WARN"
    root: INFO
    org:
      springframework:
        # set spring security logging level to "INFO"
        security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth:
  otp-expiry: ${AUTH_OTP_EXPIRY:300s}
  reset-token-expiry: ${AUTH_RESET_TOKEN_EXPIRY:900s}
  mail-config:
    provider: log
    from: noreply@yourdomain.com
    name: XXX Company
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    issuer: springboot-basiclogin
    access-token-ttl: 2h
    refresh-token-ttl: 24h
  fusionauth:
    base-url: ${FUSIONAUTH_URL:http://localhost:9011}
    client-id: ${FUSIONAUTH_CLIENT_ID:514556d8-c2d9-4ead-ad8f-24f08fb68d11}
    client-secret: ${FUSIONAUTH_CLIENT_SECRET:qfftDP4o-WLR3eayLM1jvI7-xrOqlGt3mYr2zVX9g3E}
    redirect-uri: ${FUSIONAUTH_REDIRECT_URI:http://localhost:8080/auths/social/callback}
    api-key: ${FUSIONAUTH_API_KEY:VgM8ecnDyunG-8uA4ZirJyYX7ky5An4rKbW1bwr8vyT4sEj_wWxzZlvj}
    idp-ids:
      google: ${FUSIONAUTH_IDP_GOOGLE_ID:a021e9c4-0270-4efa-8aaf-88ab91245944}
      facebook: ${FUSIONAUTH_IDP_FACEBOOK_ID:7fb58645-ca0d-4525-ae91-4ec41da1240a}
  webhook:
    secret: ${FUSIONAUTH_WEBHOOK_SECRET:my-webhook-fusion-12345-secret}
    signature-key: ${FUSIONAUTH_WEBHOOK_SIGNATURE_KEY:koxGfHbSgXZ2RODDSFlUoT9ImaFuTZjesIvE95JTLm0=}
    max-event-age-seconds: ${FUSIONAUTH_WEBHOOK_MAX_AGE_SECONDS:300}
    rate-limit:
      max-attempts: ${FUSIONAUTH_WEBHOOK_RATE_LIMIT_MAX:100}
      window-seconds: ${FUSIONAUTH_WEBHOOK_RATE_LIMIT_WINDOW:60}





