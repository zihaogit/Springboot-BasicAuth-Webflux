spring:
  r2dbc:
    username: postgres
    password: root
    url: r2dbc:postgresql://localhost:5432/security_assignment
  flyway:
    username: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    url: jdbc:postgresql://localhost:5432/security_assignment
    locations: classpath:db/migration/common,classpath:db/migration/dev
    baseline-on-migrate: true
  main:
    banner-mode: off
  #for email (localhost)
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false

logging:
  level:
    #set root logging to "WARN"
    root: INFO
    org:
      springframework:
        # set spring security logging level to "INFO"
        security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth:
  mail-config:
    provider: log
    from: noreply@yourdomain.com
    name: XXX Company





