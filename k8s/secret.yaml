# ── K8s Secret Reference: springboot-iam-secrets ────────────────────
#
# Create the secret directly from your local .env file using kubectl:
#
#   kubectl create secret generic springboot-iam-secrets --from-env-file=.env
#
# To verify the secret after creation:
#
#   kubectl get secret springboot-iam-secrets
#
# To delete and re-create if credentials change:
#
#   kubectl delete secret springboot-iam-secrets
#   kubectl create secret generic springboot-iam-secrets --from-env-file=.env
# ─────────────────────────────────────────────────────────────────────
